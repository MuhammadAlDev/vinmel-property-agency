# Konfigurasi Supabase CLI untuk pengembangan lokal (`npx supabase start`).
# Semua kredensial dibaca dari environment, JANGAN ditulis di file ini.
project_id = "vinmel-agency"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback"]

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
template = "Kode masuk Vinmel Agency: {{ .Code }}"

# OTP WhatsApp via Twilio (Supabase mengirim OTP lewat channel "whatsapp").
[auth.sms.twilio]
enabled = true
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
